name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build CSS
        run: bun run css
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t github-oc-tracker:ci .
      - name: Smoke test container
        run: |
          docker run -d --name tracker -p 3000:3000 github-oc-tracker:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null 2>&1; then
              echo "healthy" && exit 0
            fi
            sleep 1
          done
          echo "container never became healthy" >&2
          docker logs tracker >&2
          exit 1
