services:
  tracker:
    build: .
    image: github-oc-tracker:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DB_PATH: /data/tracker.db
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-2}
      MAX_COMMITS_PER_SYNC: ${MAX_COMMITS_PER_SYNC:-10000}
      AUTO_TRACK_NEW_REPOS: ${AUTO_TRACK_NEW_REPOS:-true}
      INCLUDE_FORKS: ${INCLUDE_FORKS:-false}
      INCLUDE_ARCHIVED: ${INCLUDE_ARCHIVED:-true}
      TZ_OFFSET_MINUTES: ${TZ_OFFSET_MINUTES:-0}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - tracker-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tracker-data:
